name: Scanner
run-name: "${{ github.event_name == 'schedule' && (github.event.schedule == '0 * * * *' && 'scheduled refresh' || 'scheduled scan top 400') || github.event_name == 'workflow_dispatch' && (inputs.mode == 'scan' && format('scan top {0}', inputs.cappers) || 'refresh') || 'deploy site' }}"
on:
  schedule:
    # Times are PST (UTC-8). During PDT they run one hour later on the clock.
    - cron: "30 13 * * *"   # 5:30 AM PT — full top-400 scan
    - cron: "30 18 * * *"   # 10:30 AM PT — full top-400 scan
    - cron: "30 22 * * *"   # 2:30 PM PT — full top-400 scan
    - cron: "30 2 * * *"    # 6:30 PM PT — full top-400 scan
    - cron: "0 * * * *"     # hourly at :00 PT — light refresh
  workflow_dispatch:
    inputs:
      mode:
        description: scan (full OrcaLayer scan) or refresh (ESPN + Kalshi only)
        type: choice
        options: [refresh, scan]
        default: refresh
      cappers:
        description: number of top all-time sports whales to scan
        type: string
        default: "400"
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: scanner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Always start from the latest main, never the commit that queued this run (a queued refresh used to roll scan data back).
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore backfill cache (raw 90-day whale bets, incremental)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/cache@v4
        with:
          path: scanner/.cache/backfill_raw.json
          key: backfill-raw-90d-${{ github.run_id }}
          restore-keys: |
            backfill-raw-90d-
            backfill-raw-
      - name: Scan or refresh
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        working-directory: scanner
        env:
          ORCA_API_KEY: ${{ secrets.ORCA_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CAPPERS: ${{ inputs.cappers }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$SCHEDULE" = "0 * * * *" ]; then
              MODE=refresh
              CAPPERS=400
            else
              MODE=scan
              CAPPERS=400
            fi
          else
            MODE="${INPUT_MODE:-refresh}"
            CAPPERS="${INPUT_CAPPERS:-400}"
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          if [ "$MODE" = "scan" ]; then
            N=$(printf '%s' "$CAPPERS" | tr -cd '0-9'); N=${N:-400}; [ "$N" -lt 1 ] && N=1; [ "$N" -gt 2000 ] && N=2000
            echo "Running scan top $N (event=$EVENT_NAME schedule=${SCHEDULE:-n/a})"
            python3 -u scan.py --cappers "$N"
          else
            echo "Running refresh (event=$EVENT_NAME schedule=${SCHEDULE:-n/a})"
            python3 -u refresh.py
          fi
      - name: Commit new data
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          MODE: ${{ env.MODE }}
        run: |
          set -euo pipefail
          git config user.name "whale-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Data/site outputs only. Never add .trigger_token or scanner/.orca_api_key.
          outs=(data.json proven_picks.json scanner/history.json scanner/page_embed.json scanner/capper_history.json scanner/whale_windows.json scanner/tracked_cappers.json scanner/backfill.json scanner/proven_picks.json scanner/wallet_stats.json)

          validate_outs() {
            python3 scanner/validate_json.py "$1" "${outs[@]}"
          }

          save_outs() {
            mkdir -p /tmp/scanner-out
            for f in "${outs[@]}"; do
              [ -f "$f" ] && cp -f "$f" "/tmp/scanner-out/$(basename "$f")"
            done
          }
          restore_outs() {
            [ -f /tmp/scanner-out/data.json ] && cp -f /tmp/scanner-out/data.json data.json
            [ -f /tmp/scanner-out/history.json ] && cp -f /tmp/scanner-out/history.json scanner/history.json
            [ -f /tmp/scanner-out/page_embed.json ] && cp -f /tmp/scanner-out/page_embed.json scanner/page_embed.json
            [ -f /tmp/scanner-out/capper_history.json ] && cp -f /tmp/scanner-out/capper_history.json scanner/capper_history.json
            [ -f /tmp/scanner-out/whale_windows.json ] && cp -f /tmp/scanner-out/whale_windows.json scanner/whale_windows.json
            [ -f /tmp/scanner-out/tracked_cappers.json ] && cp -f /tmp/scanner-out/tracked_cappers.json scanner/tracked_cappers.json
            [ -f /tmp/scanner-out/backfill.json ] && cp -f /tmp/scanner-out/backfill.json scanner/backfill.json
            [ -f /tmp/scanner-out/proven_picks.json ] && cp -f /tmp/scanner-out/proven_picks.json scanner/proven_picks.json && cp -f /tmp/scanner-out/proven_picks.json proven_picks.json
            [ -f /tmp/scanner-out/wallet_stats.json ] && cp -f /tmp/scanner-out/wallet_stats.json scanner/wallet_stats.json
          }
          commit_outs() {
            validate_outs "pre-commit" || { echo "ERROR: refusing to commit invalid JSON"; return 1; }
            git add -- "${outs[@]}"
            if git diff --cached --quiet; then
              echo "no changes to commit"
              return 0
            fi
            git commit -m "${MODE:-update} $(TZ=America/Los_Angeles date '+%a %b %-d %-I:%M %p PT')"
          }

          # Never roll newer data back: if main already holds a newer scan (or a newer refresh of the same scan)
          # than this run produced, drop this run's output and publish the latest main instead.
          fresh_key='import json,sys; d=json.load(open(sys.argv[1])); e=json.load(open(sys.argv[2])); print(int(d.get("ts",0)), int(e.get("refreshTs",0)))'
          main_is_newer() {
            git fetch origin main || return 1
            git show origin/main:data.json > /tmp/remote_data.json 2>/dev/null || return 1
            git show origin/main:scanner/page_embed.json > /tmp/remote_embed.json 2>/dev/null || echo '{}' > /tmp/remote_embed.json
            local r l
            r=$(python3 -c "$fresh_key" /tmp/remote_data.json /tmp/remote_embed.json 2>/dev/null) || return 1
            l=$(python3 -c "$fresh_key" data.json scanner/page_embed.json 2>/dev/null) || return 1
            local rt=${r% *} rr=${r#* } lt=${l% *} lr=${l#* }
            if [ "$rt" -gt "$lt" ] || { [ "$rt" -eq "$lt" ] && [ "$rr" -gt "$lr" ]; }; then
              echo "main already has newer data (scan $rt/refresh $rr > scan $lt/refresh $lr)"
              return 0
            fi
            return 1
          }
          discard_and_exit() {
            echo "discarding this run's output; publishing latest main"
            git rebase --abort || true
            git reset --hard origin/main
            exit 0
          }
          if main_is_newer; then discard_and_exit; fi

          save_outs
          commit_outs

          # Leftover unstaged/untracked files (caches, generated line files) must not block rebase.
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git stash push -u -m "scanner-uncommitted" || true
          fi

          pushed=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if main_is_newer; then discard_and_exit; fi
            if git pull --rebase -X theirs origin main && validate_outs "post-rebase"; then
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
            else
              echo "rebase or JSON validation failed on attempt $i"
              git rebase --abort || true
            fi
            sleep $((i * 3))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "rebase/push failed; resetting to origin/main and recommitting outputs"
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            restore_outs
            commit_outs
            if validate_outs "post-restore" && git push origin HEAD:main; then
              pushed=1
            fi
          fi

          git stash pop || true
          if [ "$pushed" -ne 1 ]; then
            echo "ERROR: failed to push scan/refresh data to main after retries"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
