name: Follow-check
# Starts at :30 UTC each hour (same minute in PT while the offset is whole hours)
# and light-refreshes whale data about every 5 minutes until just before the
# :20 full scan. GitHub's */5 cron is too often delayed or dropped.
# Scheduled runs no-op from midnight–6 AM America/Los_Angeles (DST-safe).
# Manual dispatch is always allowed, including overnight (one pass, or a loop).
on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "Run a single light refresh instead of the 5-minute loop"
        required: false
        default: false
        type: boolean

concurrency:
  group: scanner
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  follow-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KALSHI_SCANNER_PASSCODE: ${{ secrets.KALSHI_SCANNER_PASSCODE }}
    steps:
      - name: Quiet hours (midnight–6 AM PT)
        id: quiet
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/Los_Angeles"))
          skip = 0 <= now.hour < 6
          print("PT now %s hour=%d quiet=%s" % (now.strftime("%a %b %-d %-I:%M %p %Z"), now.hour, skip))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("skip=%s\n" % ("1" if skip else "0"))
          PY

      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.quiet.outputs.skip != '1'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.quiet.outputs.skip != '1'
        with:
          python-version: "3.12"

      - name: Unwrap published data
        if: github.event_name != 'schedule' || steps.quiet.outputs.skip != '1'
        run: |
          set -euo pipefail
          pip install -q cryptography
          python3 scanner/gate_crypto.py decrypt

      - name: Restore backfill cache (raw 90-day whale bets, incremental)
        if: github.event_name != 'schedule' || steps.quiet.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: scanner/.cache/backfill_raw.json
          key: backfill-raw-90d-${{ github.run_id }}
          restore-keys: |
            backfill-raw-90d-
            backfill-raw-

      - name: Light-refresh loop
        if: github.event_name != 'schedule' || steps.quiet.outputs.skip != '1'
        id: loop
        env:
          FOLLOW_LOOP_SECS: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.once == 'true') && '1' || '2880' }}
        run: |
          set -euo pipefail
          bash scanner/refresh_loop.sh
